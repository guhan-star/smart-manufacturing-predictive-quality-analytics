[project]
name = "smart-manufacturing-secom"
version = "0.1.0"
description = "Smart Manufacturing: Intelligent Process Quality Analysis and Predictive Defect Detection Using Machine Learning (UCI SECOM)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=6.29.0",
    "joblib>=1.6.0",
    "matplotlib>=3.9.0",
    "nbconvert>=7.16.0",
    "nbformat>=5.10.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "plotly>=7.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.14.0",
    "seaborn>=0.13.0",
    "shap>=0.51.0",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secom_project"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
